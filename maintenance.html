<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Auvenda Maritime Training Platform opens on 1 September.">
  <title>Auvenda — Opening 1 September</title>
  <link rel="icon" href="assets/auvenida/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="brand-styles.css">
  <style>
    .maintenance-page { min-height:100vh; color:#fff; background:var(--navy) url("assets/auvenida/bg-dark.svg") center/cover no-repeat; }
    .maintenance-header { height:82px; display:flex; align-items:center; }
    .maintenance-main { min-height:calc(100vh - 82px); display:grid; align-items:center; padding:80px 0; }
    .maintenance-copy { max-width:780px; }
    .maintenance-kicker { margin:0 0 24px; color:var(--gold); font-size:11px; font-weight:700; letter-spacing:.16em; }
    .maintenance-title { max-width:760px; margin:0; font:600 clamp(54px,8vw,112px)/.94 "IBM Plex Serif",Georgia,serif; letter-spacing:-.05em; }
    .maintenance-title em { font-style:italic; }
    .maintenance-lead { max-width:520px; margin:34px 0 0; color:#dce9f5; font-size:clamp(18px,2vw,23px); line-height:1.5; }
    .maintenance-date { display:inline-flex; margin-top:42px; padding:15px 20px; color:var(--navy); background:var(--gold); font-size:14px; font-weight:700; letter-spacing:.08em; }
    @media (max-width:800px) { .maintenance-header { height:66px; }.maintenance-main { min-height:calc(100vh - 66px); padding:64px 0; }.maintenance-title { font-size:clamp(52px,16vw,76px); }.maintenance-date { margin-top:32px; } }
  </style>
</head>
<body class="maintenance-page">
  <header class="maintenance-header">
    <div class="container">
      <a class="brand" href="index.html" aria-label="Auvenda home">
        <img class="brand-logo" src="assets/auvenida/logo.svg" alt="Auvenda">
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="brand-descriptor">Maritime<br>Training Platform</span>
      </a>
    </div>
  </header>
  <main class="maintenance-main">
    <div class="container maintenance-copy">
      <p class="maintenance-kicker">MARITIME TRAINING PLATFORM</p>
      <h1 class="maintenance-title">We are preparing<br><em>to launch.</em></h1>
      <p class="maintenance-lead">Auvenda will open for maritime professionals, training providers and shipping companies on 1 September.</p>
      <time class="maintenance-date" datetime="2026-09-01">OPENING 1 SEPTEMBER</time>
    </div>
  </main>
</body>
</html>
